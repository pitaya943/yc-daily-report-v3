<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, "Noto Sans TC", sans-serif; margin: 0; padding: 16px; max-width: 44rem; margin-inline: auto; line-height: 1.5; }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  h2 { font-size: 1rem; margin: 0 0 .5rem; }
  .sub { margin: 0 0 1rem; opacity: .75; }
  fieldset, section.card { border: 1px solid color-mix(in srgb, currentColor 25%, transparent); border-radius: 8px; margin: 0 0 1rem; padding: .75rem; }
  legend { font-weight: 600; padding: 0 .25rem; }
  label { display: block; margin: .35rem 0 .1rem; }
  label.inline { display: flex; gap: .5rem; align-items: center; margin: .35rem 0; }
  input[type=text], input[type=password], select, button { font: inherit; padding: .5rem .6rem; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 35%, transparent); background: transparent; color: inherit; }
  input[type=text], input[type=password], select { width: 100%; box-sizing: border-box; }
  button { background: #1d4ed8; color: #fff; border-color: #1d4ed8; font-weight: 600; cursor: pointer; margin-top: .6rem; }
  button.secondary { background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 40%, transparent); }
  button[disabled] { opacity: .6; }
  table { border-collapse: collapse; width: 100%; margin: 0 0 1rem; }
  th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
  .badge { font-size: .8rem; padding: .05rem .45rem; border-radius: 999px; border: 1px solid color-mix(in srgb, currentColor 35%, transparent); }
  .badge.archived { background: color-mix(in srgb, #b45309 18%, transparent); }
  .badge.locked { background: color-mix(in srgb, #b91c1c 18%, transparent); }
  button.small { padding: .15rem .5rem; font-size: .85rem; margin: 0 0 0 .4rem; }
  form.unlock-form { display: inline; }
  form.unlock-form .result { display: inline; }
  form.unlock-form .saved { display: inline-block; margin: 0 0 0 .4rem; padding: .15rem .5rem; }
  .form-error { border: 1px solid #b91c1c; background: color-mix(in srgb, #b91c1c 12%, transparent); border-radius: 6px; padding: .6rem .75rem; margin: 0 0 .75rem; }
  .form-error[hidden] { display: none; }
  .saved { border: 1px solid #15803d; background: color-mix(in srgb, #15803d 12%, transparent); border-radius: 6px; padding: .6rem .75rem; margin: .75rem 0 0; }
  .hint { font-size: .85rem; opacity: .7; margin: 0 0 .25rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem .75rem; }
  @media (max-width: 30rem) { .grid { grid-template-columns: 1fr; } }
</style>
