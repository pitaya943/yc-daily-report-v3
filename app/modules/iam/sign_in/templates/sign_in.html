<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入</title>
  <style>
    :root { --bg: #f4f5f7; --card: #fff; --text: #1d2330; --muted: #5d6676; --line: #c9ced8; --accent: #1f5fbf; --danger: #b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14171d; --card: #1d222b; --text: #e8ebf0; --muted: #9aa3b2; --line: #394150; --accent: #6ea3f2; --danger: #f2877f; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, "Noto Sans TC", sans-serif; }
    main { width: min(100% - 32px, 380px); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
    h1 { margin: 0 0 16px; font-size: 1.4rem; }
    label { display: block; margin: 16px 0 4px; color: var(--muted); font-size: .9rem; }
    select, input { width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
    button { margin-top: 20px; width: 100%; padding: 11px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
    @media (prefers-color-scheme: dark) { button { color: #0b1220; } }
    #message { min-height: 1.5em; margin: 12px 0 0; color: var(--danger); font-size: .9rem; }
    .hint { color: var(--muted); font-size: .85rem; margin: 6px 0 0; }
  </style>
</head>
<body>
<main>
  <h1>登入</h1>

  {# 第一步：選群組。用一般的 GET 表單，伺服器依群組列出名單；不需要 JavaScript。 #}
  <form method="get" action="/sign-in">
    <label for="group">群組</label>
    <select id="group" name="group" onchange="this.form.submit()">
      <option value="" {% if not group %}selected{% endif %}>請選擇群組</option>
      {% for key, label in groups.items() %}
      <option value="{{ key }}" {% if key == group %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    <noscript><button type="submit">列出名單</button></noscript>
  </form>

  {# 第二步：選帳戶、輸入密碼。伺服器會重新驗證每個欄位。 #}
  <form id="sign-in-form" method="post" action="/sign-in">
    <input type="hidden" name="group" value="{{ group or '' }}">
    <label for="name">登入帳戶</label>
    <select id="name" name="name" required {% if not group %}disabled{% endif %}>
      <option value="">{{ pick_account }}</option>
      {% for n in names %}
      <option value="{{ n }}">{{ n }}</option>
      {% endfor %}
    </select>
    {% if not group %}<p class="hint">先選群組，再選帳戶。</p>{% endif %}

    <label for="password">登入密碼</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <p id="message" role="alert" aria-live="polite"></p>
    <button type="submit">登入</button>
  </form>
</main>

<script>
  // 成功時伺服器回 303 轉址，fetch 會自動跟隨；失敗時回 JSON，把 message 顯示出來。
  const form = document.getElementById("sign-in-form");
  const message = document.getElementById("message");
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    message.textContent = "";
    try {
      const response = await fetch(form.action, { method: "POST", body: new URLSearchParams(new FormData(form)), credentials: "same-origin" });
      if (response.redirected) { window.location.assign(response.url); return; }
      const body = await response.json().catch(() => ({}));
      message.textContent = body.message || "登入失敗，請稍後再試";
    } catch (e) {
      message.textContent = "無法連線，請稍後再試";
    }
  });
</script>
</body>
</html>
