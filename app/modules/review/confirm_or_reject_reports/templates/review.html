{% extends "base.html" %}
{% block title %}審核{% endblock %}
{% block content %}
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, "Noto Sans TC", sans-serif; margin: 0; padding: 16px; max-width: 40rem; margin-inline: auto; line-height: 1.5; }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: .6rem; }
  a.card { display: block; padding: .8rem 1rem; border-radius: 8px; border: 1px solid color-mix(in srgb, currentColor 35%, transparent); color: inherit; text-decoration: none; font-weight: 600; }
  a.card:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
</style>
<h1>審核</h1>
<nav aria-label="審核">
  <ul>
    {% for label, href in links %}<li><a class="card" href="{{ href }}">{{ label }}</a></li>{% endfor %}
  </ul>
</nav>
{% endblock %}
